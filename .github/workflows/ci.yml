name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: add4u, POSTGRES_PASSWORD: add4u, POSTGRES_DB: add4u_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U add4u" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
        env: { CI: "true" }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: hospital-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: hospital-web/package-lock.json }
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t add4u-api backend
      - run: docker build -t add4u-hospital-web hospital-web
