# Local/staging stack:  docker compose up --build
# Production secrets (Razorpay, Firebase, Anthropic) come from .env — see .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: add4u
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-add4u}
      POSTGRES_DB: add4u
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U add4u"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://add4u:${POSTGRES_PASSWORD:-add4u}@db:5432/add4u
    ports: ["3000:3000"]

  hospital-web:
    build:
      context: ./hospital-web
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    ports: ["8080:80"]

volumes:
  pgdata:
